name: Verificar site no ar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-site.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Relatorio
        run: |
          set +e
          R=relatorio.txt
          for u in / /en/ /es/; do echo "POLITICA $u: $(curl -s -m 25 "https://www.buziosflat.com$u?v=$RANDOM" | grep -o -E '(30|50)% (do valor pago|of the amount paid kept|del valor pagado)|25% (do sinal|of the deposit|de la seña)|total (do sinal|de la seña)|full deposit kept' | sort | uniq -c | tr '\n' ' ')"; done
          h(){ echo "===== $1" >>$R; curl -sS -m 25 -o /tmp/body -D - "$1" 2>&1 | tr -d '\r' >>$R; echo "-- corpo: $(head -c 300 /tmp/body | tr '\n' ' ')" >>$R; }
          for d in buziosflat.com www.buziosflat.com buziosflat.com.br www.buziosflat.com.br; do echo "DNS $d A=$(dig +short A $d | tr '\n' ' ') NS=$(dig +short NS $d | tr '\n' ' ')" >>$R; done
          for u in https://www.buziosflat.com/google044473d8c1714a05.html http://www.buziosflat.com/en/ http://www.buziosflat.com/img/fachada-02.jpg https://www.buziosflat.com/es/ https://www.buziosflat.com/favicon.svg https://www.buziosflat.com/404.html https://www.buziosflat.com/ http://www.buziosflat.com/ https://buziosflat.com/ http://buziosflat.com/ "https://www.buziosflat.com/?lang=en" https://www.buziosflat.com/en/ https://www.buziosflat.com/pagina-que-nao-existe https://www.buziosflat.com/.htaccess https://www.buziosflat.com/index.php https://www.buziosflat.com/wp-login.php https://www.buziosflat.com/wp-admin/ https://www.buziosflat.com/wp-config.php https://www.buziosflat.com/xmlrpc.php https://www.buziosflat.com/wp-content/ https://www.buziosflat.com/readme.html https://www.buziosflat.com/img/ https://www.buziosflat.com/img/fachada-02.jpg https://www.buziosflat.com/robots.txt https://www.buziosflat.com/sitemap.xml https://www.buziosflat.com/favicon.ico https://www.buziosflat.com/.ftp-deploy-sync-state.json http://www.buziosflat.com.br/ https://www.buziosflat.com.br/ https://hotelar.com/buziosflat https://wa.me/5521999936368; do h "$u"; done
          echo "===== SSL" >>$R; echo | openssl s_client -connect www.buziosflat.com:443 -servername www.buziosflat.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName >>$R 2>&1
          echo | openssl s_client -connect buziosflat.com:443 -servername buziosflat.com 2>/dev/null | openssl x509 -noout -subject -dates -ext subjectAltName >>$R 2>&1
          curl -sS -m 25 -H 'Accept-Encoding: gzip' -o /dev/null -D - https://www.buziosflat.com/ | grep -i -E 'content-encoding|content-length' >>$R
          split -b 3500 $R parte_
          for f in parte_*; do echo "::warning title=$f::$(cat $f | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; done
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio
          path: relatorio.txt
