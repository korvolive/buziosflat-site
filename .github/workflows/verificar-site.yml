name: Verificar site no ar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/verificar-site.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for d in buziosflat.com www.buziosflat.com buziosflat.com.br www.buziosflat.com.br; do echo "== $d"; dig +short NS $d; dig +short A $d; done
      - name: HTTP
        run: |
          for u in https://www.buziosflat.com/ https://buziosflat.com/ http://www.buziosflat.com/ http://www.buziosflat.com.br/ https://www.buziosflat.com.br/ http://buziosflat.com.br/; do
            echo "== $u"; curl -sS -m 20 -o /tmp/p.html -D - "$u" | grep -iE '^(HTTP|location|server)'; grep -o '<title>[^<]*' /tmp/p.html | head -1; grep -c 'Horário de descanso' /tmp/p.html || true
          done
