name: Enviar site para a HostGator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Gerar as versões em inglês e espanhol (/en/ e /es/)
        run: |
          mkdir -p /tmp/gen && npm install --prefix /tmp/gen --no-audit --no-fund jsdom@24.1.3
          NODE_PATH=/tmp/gen/node_modules node scripts/gerar-idiomas.cjs
      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git/**
            **/.git*
            **/node_modules/**
            .github/**
            scripts/**
            README.md
