name: Enviar site para a HostGator

# Por enquanto só roda quando alguém clicar em "Run workflow" na aba Actions.
# Depois do backup do site atual, troque para enviar a cada alteração na main.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git/**
            .gitignore
            .github/**
            README.md
